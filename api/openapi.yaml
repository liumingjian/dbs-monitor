openapi: 3.0.3
info:
  title: dbs-monitor API
  version: 0.1.0
servers:
  - url: /
tags:
  - name: instances
  - name: metrics
  - name: alert-rules
  - name: auth
  - name: agent
  - name: collection
  - name: users
paths:
  /api/v1/login:
    $ref: paths/auth.yaml#/~1api~1v1~1login
  /api/v1/instances:
    $ref: paths/instances.yaml#/~1api~1v1~1instances
  /api/v1/instances/{id}:
    $ref: paths/instances.yaml#/~1api~1v1~1instances~1{id}
  /api/v1/instances/{id}/credentials:
    $ref: paths/instances.yaml#/~1api~1v1~1instances~1{id}~1credentials
  /api/v1/instances/{id}/metrics/series:
    $ref: paths/metrics.yaml#/~1api~1v1~1instances~1{id}~1metrics~1series
  /api/v1/instances/{id}/collection/tasks:
    $ref: paths/collection.yaml#/~1api~1v1~1instances~1{id}~1collection~1tasks
  /api/v1/instances/{id}/collection/tasks/{task_id}:
    $ref: paths/collection.yaml#/~1api~1v1~1instances~1{id}~1collection~1tasks~1{task_id}
  /api/v1/alert-rules:
    $ref: paths/alert-rules.yaml#/~1api~1v1~1alert-rules
  /api/agent/v1/report:
    $ref: paths/agent.yaml#/~1api~1agent~1v1~1report
  /api/v1/me:
    $ref: paths/users.yaml#/~1api~1v1~1me
  /api/v1/users:
    $ref: paths/users.yaml#/~1api~1v1~1users
  /api/v1/users/{id}/status:
    $ref: paths/users.yaml#/~1api~1v1~1users~1{id}~1status
  /api/v1/users/{id}/role:
    $ref: paths/users.yaml#/~1api~1v1~1users~1{id}~1role
  /api/v1/users/{id}/password:
    $ref: paths/users.yaml#/~1api~1v1~1users~1{id}~1password
  /api/v1/password:
    $ref: paths/users.yaml#/~1api~1v1~1password
components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
  schemas:
    Unavailability:
      $ref: components/enums.yaml#/Unavailability
    AlertStatus:
      $ref: components/enums.yaml#/AlertStatus
    CapabilityStatus:
      $ref: components/enums.yaml#/CapabilityStatus
    AlertAggregation:
      $ref: components/enums.yaml#/AlertAggregation
    AlertOperator:
      $ref: components/enums.yaml#/AlertOperator
    AlertSeverity:
      $ref: components/enums.yaml#/AlertSeverity
    NoDataPolicy:
      $ref: components/enums.yaml#/NoDataPolicy
    AlertRuleInput:
      $ref: components/schemas/alert-rules.yaml#/AlertRuleInput
    AlertRule:
      $ref: components/schemas/alert-rules.yaml#/AlertRule
    InstanceCreateInput:
      $ref: components/schemas/instances.yaml#/InstanceCreateInput
    InstanceMetadataInput:
      $ref: components/schemas/instances.yaml#/InstanceMetadataInput
    InstanceCredentialInput:
      $ref: components/schemas/instances.yaml#/InstanceCredentialInput
    InstanceCredentialUpdated:
      $ref: components/schemas/instances.yaml#/InstanceCredentialUpdated
    Instance:
      $ref: components/schemas/instances.yaml#/Instance
    InstanceCreated:
      $ref: components/schemas/instances.yaml#/InstanceCreated
    CollectionTaskState:
      $ref: components/schemas/collection.yaml#/CollectionTaskState
    CollectionTaskIntervalInput:
      $ref: components/schemas/collection.yaml#/CollectionTaskIntervalInput
    MetricSeriesResponse:
      $ref: components/schemas/metrics.yaml#/MetricSeriesResponse
    AgentReport:
      $ref: components/schemas/agent.yaml#/AgentReport
    Role:
      $ref: components/schemas/users.yaml#/Role
    User:
      $ref: components/schemas/users.yaml#/User
    UserCreateInput:
      $ref: components/schemas/users.yaml#/UserCreateInput
    UserCreated:
      $ref: components/schemas/users.yaml#/UserCreated
    UserStatusInput:
      $ref: components/schemas/users.yaml#/UserStatusInput
    UserRoleInput:
      $ref: components/schemas/users.yaml#/UserRoleInput
    PasswordIssued:
      $ref: components/schemas/users.yaml#/PasswordIssued
    PasswordChangeInput:
      $ref: components/schemas/users.yaml#/PasswordChangeInput
    Error:
      $ref: components/errors.yaml#/Error
