PlatformEventKind:
  type: string
  enum:
    - LOGIN_SUCCEEDED
    - LOGIN_FAILED
    - USER_CREATED
    - USER_STATUS_CHANGED
    - USER_STATUS_CHANGE_REJECTED
    - USER_ROLE_CHANGED
    - USER_PASSWORD_RESET
    - INSTANCE_CREDENTIAL_UPDATED
    - INSTANCE_REMOVED
    - MASTER_KEY_ROTATED
PlatformEvent:
  type: object
  required: [id, kind, occurred_at, actor]
  properties:
    id: { type: integer, format: int64 }
    kind: { $ref: '#/PlatformEventKind' }
    occurred_at: { type: string, format: date-time }
    actor: { type: string }
    subject_id: { type: string, format: uuid }
