AgentMetric:
  type: object
  required: [metric, value]
  properties:
    metric:
      type: string
      enum:
        - host.cpu.usage_percent
        - host.memory.usage_percent
        - host.disk.usage_percent
        - host.disk.free_bytes
        - host.disk.iops
        - host.disk.throughput_bytes_per_sec
        - host.network.bytes_per_sec
    value: { type: number, format: double }
AgentSample:
  type: object
  required: [timestamp, metrics]
  properties:
    timestamp: { type: string, format: date-time }
    metrics:
      type: array
      items: { $ref: '#/AgentMetric' }
AgentReport:
  type: object
  required: [instance_id, agent_version, timestamp, metrics]
  properties:
    instance_id: { type: string, format: uuid }
    agent_version: { type: string, minLength: 1 }
    timestamp: { type: string, format: date-time }
    metrics:
      type: array
      items: { $ref: '#/AgentMetric' }
    backfill:
      type: array
      description: Unacknowledged samples from the Agent's five-minute in-memory window.
      items: { $ref: '#/AgentSample' }
AgentReportAccepted:
  type: object
  required: [server_version]
  properties:
    server_version:
      type: string
      minLength: 1
      description: Version of the server that accepted the report.
