AgentMetric:
  type: object
  required: [metric, value]
  properties:
    metric:
      type: string
      enum:
        - host.cpu.usage_percent
        - host.memory.usage_percent
        - host.disk.usage_percent
        - host.disk.free_bytes
        - host.disk.iops
        - host.disk.throughput_bytes_per_sec
        - host.network.bytes_per_sec
    value: { type: number, format: double }
AgentSample:
  type: object
  required: [timestamp, metrics]
  properties:
    timestamp: { type: string, format: date-time }
    metrics:
      type: array
      items: { $ref: '#/AgentMetric' }
AgentReport:
  type: object
  required: [instance_id, agent_version, timestamp, metrics]
  properties:
    instance_id: { type: string, format: uuid }
    agent_version: { type: string, minLength: 1 }
    timestamp: { type: string, format: date-time }
    metrics:
      type: array
      items: { $ref: '#/AgentMetric' }
    backfill:
      type: array
      description: Unacknowledged samples from the Agent's five-minute in-memory window.
      items: { $ref: '#/AgentSample' }
AgentReportAccepted:
  type: object
  required: [server_version, server_time]
  properties:
    server_version:
      type: string
      minLength: 1
      description: Version of the server that accepted the report.
    server_time:
      type: string
      format: date-time
      description: Server time used by the Agent startup clock check.
AgentRegistrationState:
  type: string
  enum: [NEVER_REGISTERED, EXPECTED_ONLINE, REVOKED, DISABLED]
AgentInstallation:
  type: object
  required: [ca_fingerprint_sha256, installer_path, authentication_path, file_mode, restart_command]
  properties:
    ca_fingerprint_sha256:
      type: string
      description: Lowercase SHA-256 fingerprint of the platform CA certificate in DER form.
    installer_path: { type: string }
    authentication_path: { type: string }
    file_mode: { type: string, enum: ['0600'] }
    restart_command: { type: string }
AgentRegistration:
  type: object
  required: [state, agent_expected, installation]
  properties:
    state: { $ref: '#/AgentRegistrationState' }
    agent_expected: { type: boolean }
    issued_at: { type: string, format: date-time }
    revoked_at: { type: string, format: date-time }
    first_registered_at: { type: string, format: date-time }
    agent_version: { type: string }
    installation: { $ref: '#/AgentInstallation' }
AgentTokenIssued:
  type: object
  required: [agent_token, registration]
  properties:
    agent_token:
      type: string
      writeOnly: true
      description: One-time 32-byte base64url Agent token. It cannot be read again.
    registration: { $ref: '#/AgentRegistration' }
