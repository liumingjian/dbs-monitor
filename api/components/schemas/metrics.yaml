MetricSeriesResponse:
  type: object
  required: [from, to, step, metrics]
  properties:
    from: { type: string, format: date-time }
    to: { type: string, format: date-time }
    step: { type: string }
    metrics:
      type: array
      items:
        type: object
        required: [metric, unit, unavailability, series]
        properties:
          metric: { type: string }
          unit: { type: string }
          unavailability:
            nullable: true
            allOf:
              - $ref: ../enums.yaml#/Unavailability
          series:
            type: array
            items:
              type: object
              required: [labels, points]
              properties:
                labels:
                  type: object
                  additionalProperties: { type: string }
                points:
                  type: array
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: number
                      nullable: true
                      x-go-type: "*float64"
