InstanceCreateInput:
  type: object
  required: [name, host, port, username, password]
  properties:
    name: { type: string, minLength: 1 }
    engine:
      $ref: ../enums.yaml#/InstanceEngine
    host: { type: string, minLength: 1 }
    port: { type: integer, minimum: 1, maximum: 65535 }
    database:
      type: string
      description: >-
        Bootstrap database: the database used to open the connection. It does not delimit
        what is monitored. Omit it to let the server pick the engine default (PostgreSQL:
        postgres); MySQL has no such concept.
      x-go-type-skip-optional-pointer: true
    username: { type: string, minLength: 1 }
    password: { type: string, minLength: 1 }
InstanceMetadataInput:
  type: object
  required: [name, host, port]
  properties:
    name: { type: string, minLength: 1 }
    host: { type: string, minLength: 1 }
    port: { type: integer, minimum: 1, maximum: 65535 }
    database:
      type: string
      description: >-
        Bootstrap database: the database used to open the connection. It does not delimit
        what is monitored. Omit it to let the server pick the engine default (PostgreSQL:
        postgres); MySQL has no such concept.
      x-go-type-skip-optional-pointer: true
InstanceCredentialInput:
  type: object
  required: [username, password]
  properties:
    username: { type: string, minLength: 1 }
    password: { type: string, minLength: 1 }
InstanceCredentialUpdated:
  type: object
  required: [username]
  properties:
    username: { type: string }
InstanceCreated:
  type: object
  required: [instance]
  properties:
    instance:
      $ref: '#/Instance'
HealthAttribution:
  type: object
  required: [rule_name]
  properties:
    rule_name: { type: string }
    current_value: { type: number, format: double }
HealthAlertCounts:
  type: object
  required: [critical, warning, info]
  properties:
    critical: { type: integer, minimum: 0 }
    warning: { type: integer, minimum: 0 }
    info: { type: integer, minimum: 0 }
HealthFlags:
  type: object
  required: [no_data, in_maintenance, recently_recovered, ignored, configuration_missing]
  properties:
    no_data: { type: boolean }
    in_maintenance: { type: boolean }
    recently_recovered: { type: boolean }
    ignored: { type: integer, minimum: 0 }
    configuration_missing: { type: integer, minimum: 0 }
InstanceHealth:
  type: object
  required: [status, counts, flags]
  properties:
    status:
      $ref: ../enums.yaml#/HealthStatus
    attribution:
      $ref: '#/HealthAttribution'
    counts:
      $ref: '#/HealthAlertCounts'
    flags:
      $ref: '#/HealthFlags'
Instance:
  type: object
  required: [id, name, engine, host, port, username, alert_status, health, agent_status, collection_pause, agent_metrics_enabled]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    engine:
      $ref: ../enums.yaml#/InstanceEngine
    host: { type: string }
    port: { type: integer }
    database:
      type: string
      description: >-
        Bootstrap database: the database used to open the connection. It does not delimit
        what is monitored. Omit it to let the server pick the engine default (PostgreSQL:
        postgres); MySQL has no such concept.
      x-go-type-skip-optional-pointer: true
    username: { type: string }
    agent_version:
      type: string
      description: Version reported by the Agent, when one has reported.
    agent_metrics_enabled:
      type: boolean
      description: Current collection setting for Agent-provided metrics.
    alert_status:
      $ref: ../enums.yaml#/AlertStatus
    health:
      $ref: '#/InstanceHealth'
    agent_status:
      $ref: ../enums.yaml#/InstanceAgentStatus
    last_collected_at:
      type: string
      format: date-time
    data_freshness_seconds:
      type: integer
      minimum: 0
    collection_pause:
      $ref: collection.yaml#/CollectionPauseStatus
