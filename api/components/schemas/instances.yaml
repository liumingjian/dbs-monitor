InstanceInput:
  type: object
  required: [name, host, port, database, username, password]
  properties:
    name: { type: string, minLength: 1 }
    host: { type: string, minLength: 1 }
    port: { type: integer, minimum: 1, maximum: 65535 }
    database: { type: string, minLength: 1 }
    username: { type: string, minLength: 1 }
    password: { type: string, minLength: 1 }
InstanceCreated:
  type: object
  required: [instance, agent_token]
  properties:
    instance:
      $ref: '#/Instance'
    agent_token:
      type: string
      description: Returned once when the instance is created.
Instance:
  type: object
  required: [id, name, host, port, database, username, alert_status]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    host: { type: string }
    port: { type: integer }
    database: { type: string }
    username: { type: string }
    alert_status:
      $ref: ../enums.yaml#/AlertStatus
