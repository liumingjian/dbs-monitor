InstanceCreateInput:
  type: object
  required: [name, host, port, database, username, password]
  properties:
    name: { type: string, minLength: 1 }
    host: { type: string, minLength: 1 }
    port: { type: integer, minimum: 1, maximum: 65535 }
    database: { type: string, minLength: 1 }
    username: { type: string, minLength: 1 }
    password: { type: string, minLength: 1 }
InstanceMetadataInput:
  type: object
  required: [name, host, port, database]
  properties:
    name: { type: string, minLength: 1 }
    host: { type: string, minLength: 1 }
    port: { type: integer, minimum: 1, maximum: 65535 }
    database: { type: string, minLength: 1 }
InstanceCredentialInput:
  type: object
  required: [username, password]
  properties:
    username: { type: string, minLength: 1 }
    password: { type: string, minLength: 1 }
InstanceCredentialUpdated:
  type: object
  required: [username]
  properties:
    username: { type: string }
InstanceCreated:
  type: object
  required: [instance]
  properties:
    instance:
      $ref: '#/Instance'
Instance:
  type: object
  required: [id, name, host, port, database, username, alert_status, collection_pause, agent_metrics_enabled]
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    host: { type: string }
    port: { type: integer }
    database: { type: string }
    username: { type: string }
    agent_version:
      type: string
      description: Version reported by the Agent, when one has reported.
    agent_metrics_enabled:
      type: boolean
      description: Current collection setting for Agent-provided metrics.
    alert_status:
      $ref: ../enums.yaml#/AlertStatus
    collection_pause:
      $ref: collection.yaml#/CollectionPauseStatus
