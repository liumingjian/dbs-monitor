Error:
  type: object
  required: [error]
  properties:
    error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL, NETWORK_UNREACHABLE, AUTH_FAILED, VERSION_UNSUPPORTED]
          x-enum-varnames:
            - VALIDATIONFAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOTFOUND
            - CONFLICT
            - INTERNAL
            - NETWORKUNREACHABLE
            - AUTHFAILED
            - ONBOARDINGVERSIONUNSUPPORTED
        message:
          type: string
        field_errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
