Unavailability:
  type: string
  enum:
    - NO_SAMPLES_YET
    - NO_DATA_IN_RANGE
    - STALE
    - COLLECTION_PAUSED
    - COLLECTION_FAILED
    - DB_UNREACHABLE
    - AGENT_OFFLINE
    - PERMISSION_DENIED
    - EXTENSION_MISSING
    - FEATURE_DISABLED
    - VERSION_UNSUPPORTED
    - NOT_APPLICABLE_ROLE
    - COUNTER_RESET
AlertStatus:
  type: string
  enum: [OK, PENDING, FIRING, NO_DATA, RECOVERED]
HealthStatus:
  type: string
  enum: [CRITICAL, WARNING, UNKNOWN, HEALTHY, PAUSED]
  x-enum-varnames: [HealthCritical, HealthWarning, HealthUnknown, HealthHealthy, HealthPaused]
InstanceAgentStatus:
  type: string
  enum: [offline, online, not_installed, permission_denied, error]
  x-enum-varnames: [InstanceAgentOffline, InstanceAgentOnline, InstanceAgentNotInstalled, InstanceAgentPermissionDenied, InstanceAgentError]
InstanceEngine:
  type: string
  description: >-
    Database product a monitored instance runs. Decides which collection tasks apply and
    which metrics exist. Chosen at onboarding (defaults to POSTGRESQL when omitted) and
    fixed afterwards.
    Same vocabulary as MetricEngine, deliberately a narrower value set: an instance is
    always a connection to one concrete product, so AGNOSTIC is not offered here.
    Both map onto the one Go type internal/dbengine.Engine.
  enum: [POSTGRESQL]
  x-enum-varnames: [InstanceEnginePostgreSQL]
CapabilityStatus:
  type: string
  enum: [PRESENT, MISSING, NOT_APPLICABLE, UNKNOWN]
AlertAggregation:
  type: string
  enum: [latest, avg, max, min, sum, count]
AlertOperator:
  type: string
  enum: ['>', '>=', '<', '<=', '=', '!=']
  x-enum-varnames:
    - GreaterThan
    - GreaterThanEqual
    - LessThan
    - LessThanEqual
    - Equal
    - NotEqual
AlertSeverity:
  type: string
  enum: [critical, warning, info]
NoDataPolicy:
  type: string
  enum: [ignore, mark_no_data]
AlertRuleScope:
  type: string
  enum: [ALL, INSTANCES]
PlatformHealthStatus:
  type: string
  enum: [OK, DEGRADED, FAILED, UNKNOWN]
  x-enum-varnames:
    - PlatformHealthOK
    - PlatformHealthDegraded
    - PlatformHealthFailed
    - PlatformHealthUnknown
PlatformHealthSource:
  type: string
  enum:
    - SERVER_PROCESS
    - PLATFORM_DATABASE
    - COLLECTION_SCHEDULER
    - PARTITION_MAINTENANCE
    - TLS_CERTIFICATE
    - AGENT_INGRESS
    - DISK
    - CREDENTIAL_KEYRING
    - PLATFORM_DATABASE_CAPACITY
  x-enum-varnames:
    - HealthSourceServerProcess
    - HealthSourcePlatformDatabase
    - HealthSourceCollectionScheduler
    - HealthSourcePartitionMaintenance
    - HealthSourceTLSCertificate
    - HealthSourceAgentIngress
    - HealthSourceDisk
    - HealthSourceCredentialKeyring
    - HealthSourcePlatformDatabaseCapacity
AlertDisposition:
  type: string
  enum: [NONE, ACKED, IGNORED]
IgnoreReasonCode:
  type: string
  enum: [KNOWN_ISSUE, FALSE_POSITIVE, DUPLICATE, IMPACT_ACCEPTABLE, OTHER]
PerformanceEventType:
  type: string
  enum:
    - LOCK_BLOCKING
    - LONG_TRANSACTION
    - IDLE_IN_TRANSACTION
    - ACTIVE_SESSIONS_HIGH
    - REPLICATION_LAG
    - TEMP_FILES_SURGE
  x-enum-varnames:
    - EventLockBlocking
    - EventLongTransaction
    - EventIdleInTransaction
    - EventActiveSessionsHigh
    - EventReplicationLag
    - EventTempFilesSurge
MetricEngine:
  type: string
  description: >-
    Database product a metric catalogue row belongs to. Same vocabulary as InstanceEngine
    plus AGNOSTIC, which no instance can ever be: host.*, agent.* and collector.* metrics
    hang off an instance but measure the host and the collection itself, not any database
    product. Both map onto the one Go type internal/dbengine.Engine.
  enum: [POSTGRESQL, AGNOSTIC]
  x-enum-varnames: [MetricEnginePostgreSQL, MetricEngineAgnostic]
SemanticSlot:
  type: string
  enum:
    - throughput
    - connections
    - connection_saturation
    - probe_latency
    - rollback_rate
    - replication_lag
    - cache_hit_ratio
    - storage_usage
    - deadlocks
  x-enum-varnames:
    - SlotThroughput
    - SlotConnections
    - SlotConnectionSaturation
    - SlotProbeLatency
    - SlotRollbackRate
    - SlotReplicationLag
    - SlotCacheHitRatio
    - SlotStorageUsage
    - SlotDeadlocks
MetricLevel:
  type: string
  enum: [INSTANCE, DATABASE]
  x-enum-varnames: [MetricLevelInstance, MetricLevelDatabase]
MetricAggregation:
  type: string
  enum: [NONE, SUM, WEIGHTED_AVERAGE]
  x-enum-varnames: [MetricAggregationNone, MetricAggregationSum, MetricAggregationWeightedAverage]
