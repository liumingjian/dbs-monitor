Unavailability:
  type: string
  enum:
    - NO_SAMPLES_YET
    - NO_DATA_IN_RANGE
    - STALE
    - COLLECTION_PAUSED
    - COLLECTION_FAILED
    - DB_UNREACHABLE
    - AGENT_OFFLINE
    - PERMISSION_DENIED
    - EXTENSION_MISSING
    - FEATURE_DISABLED
    - VERSION_UNSUPPORTED
    - NOT_APPLICABLE_ROLE
    - COUNTER_RESET
AlertStatus:
  type: string
  enum: [OK, PENDING, FIRING, NO_DATA, RECOVERED]
CapabilityStatus:
  type: string
  enum: [PRESENT, MISSING, NOT_APPLICABLE, UNKNOWN]
AlertAggregation:
  type: string
  enum: [latest, avg, max, min, sum, count]
AlertOperator:
  type: string
  enum: ['>', '>=', '<', '<=', '=', '!=']
  x-enum-varnames:
    - GreaterThan
    - GreaterThanEqual
    - LessThan
    - LessThanEqual
    - Equal
    - NotEqual
AlertSeverity:
  type: string
  enum: [critical, warning, info]
NoDataPolicy:
  type: string
  enum: [ignore, mark_no_data]
AlertRuleScope:
  type: string
  enum: [ALL, INSTANCES]
PlatformHealthStatus:
  type: string
  enum: [OK, DEGRADED, FAILED, UNKNOWN]
  x-enum-varnames:
    - PlatformHealthOK
    - PlatformHealthDegraded
    - PlatformHealthFailed
    - PlatformHealthUnknown
PlatformHealthSource:
  type: string
  enum:
    - SERVER_PROCESS
    - PLATFORM_DATABASE
    - COLLECTION_SCHEDULER
    - PARTITION_MAINTENANCE
    - TLS_CERTIFICATE
    - AGENT_INGRESS
    - DISK
    - CREDENTIAL_KEYRING
    - TLS
    - PLATFORM_DATABASE_CAPACITY
  x-enum-varnames:
    - HealthSourceServerProcess
    - HealthSourcePlatformDatabase
    - HealthSourceCollectionScheduler
    - HealthSourcePartitionMaintenance
    - HealthSourceTLSCertificate
    - HealthSourceAgentIngress
    - HealthSourceDisk
    - HealthSourceCredentialKeyring
    - HealthSourceTLS
    - HealthSourcePlatformDatabaseCapacity
