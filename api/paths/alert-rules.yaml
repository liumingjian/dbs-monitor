/api/v1/alert-rules:
  get:
    tags: [alert-rules]
    operationId: listAlertRules
    x-required-role: READONLY
    responses:
      '200':
        description: Alert rules
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/alert-rules.yaml#/AlertRule }
  post:
    tags: [alert-rules]
    operationId: createAlertRule
    x-required-role: ALERT_ADMIN
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRuleInput }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRule }
      '400':
        description: Invalid alert rule
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
/api/v1/alert-rules/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    tags: [alert-rules]
    operationId: getAlertRule
    x-required-role: READONLY
    responses:
      '200':
        description: Alert rule
        content:
          application/json:
            schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRule }
      '404':
        description: Alert rule not found
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
  put:
    tags: [alert-rules]
    operationId: updateAlertRule
    x-required-role: ALERT_ADMIN
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRuleInput }
    responses:
      '200':
        description: Updated alert rule
        content:
          application/json:
            schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRule }
      '400':
        description: Invalid alert rule
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
      '404':
        description: Alert rule not found
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
  delete:
    tags: [alert-rules]
    operationId: deleteAlertRule
    x-required-role: ALERT_ADMIN
    responses:
      '204':
        description: Deleted
      '404':
        description: Alert rule not found
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
      '409':
        description: Built-in alert rules cannot be deleted
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
/api/v1/alert-rules/{id}/enabled:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  put:
    tags: [alert-rules]
    operationId: updateAlertRuleEnabled
    x-required-role: ALERT_ADMIN
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRuleEnabledInput }
    responses:
      '200':
        description: Updated alert rule
        content:
          application/json:
            schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRule }
      '400':
        description: Invalid enablement request
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
      '404':
        description: Alert rule not found
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
/api/v1/alert-rules/{id}/copies:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  post:
    tags: [alert-rules]
    operationId: copyAlertRule
    x-required-role: ALERT_ADMIN
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRuleCopyInput }
    responses:
      '201':
        description: Copied alert rule
        content:
          application/json:
            schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRule }
      '400':
        description: Invalid copied rule
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
      '404':
        description: Alert rule not found
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
/api/v1/alert-rule-templates:
  get:
    tags: [alert-rules]
    operationId: listAlertRuleTemplates
    x-required-role: READONLY
    parameters:
      - name: engine
        in: query
        required: false
        description: >-
          Keep only the templates that can create a rule on an instance running this engine.
          Omit it to list every template. A template addressing a semantic slot survives every
          engine that binds the slot; an engine-private one survives only its own engine.
        schema: { $ref: ../components/enums.yaml#/InstanceEngine }
    responses:
      '200':
        description: Read-only built-in alert rule templates
        content:
          application/json:
            schema:
              type: array
              items: { $ref: ../components/schemas/alert-rules.yaml#/AlertRuleTemplate }
/api/v1/alert-rule-templates/{id}/alert-rules:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  post:
    tags: [alert-rules]
    operationId: createAlertRuleFromTemplate
    x-required-role: ALERT_ADMIN
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRuleTemplateInstantiationInput }
    responses:
      '201':
        description: Created from template defaults
        content:
          application/json:
            schema: { $ref: ../components/schemas/alert-rules.yaml#/AlertRule }
      '400':
        description: Invalid template overrides
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
      '404':
        description: Alert rule template not found
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
