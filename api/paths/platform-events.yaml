/api/v1/platform-events:
  get:
    tags: [platform-events]
    operationId: listPlatformEvents
    x-required-role: READONLY
    responses:
      '200':
        description: Most recent attributable platform events
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: ../components/schemas/platform-events.yaml#/PlatformEvent }
