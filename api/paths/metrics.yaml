/api/v1/instances/{id}/metrics/series:
  get:
    tags: [metrics]
    operationId: getMetricSeries
    x-required-role: READONLY
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: metric
        in: query
        required: true
        schema:
          type: array
          items: { $ref: ../components/enums.yaml#/MetricId }
      - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
      - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      - name: step
        in: query
        required: false
        description: 缺省 auto。
        schema: { $ref: ../components/enums.yaml#/MetricStep }
      # 库级指标（TPS、提交回滚、元组读写、临时文件……）默认按目录里的聚合方式收敛成实例级的
      # 一条序列。置真则逐库展开，库名以 `database` 出现在序列的 labels 里——只有实例工作台
      # 会这么要，列表与总览一律看实例级值。实例级指标不受这个开关影响。
      - name: by_database
        in: query
        required: false
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Metric series
        content:
          application/json:
            schema: { $ref: ../components/schemas/metrics.yaml#/MetricSeriesResponse }
      '400':
        description: Invalid time range or step
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
/api/v1/instances/metrics/series:
  get:
    tags: [metrics]
    operationId: getInstancesMetricSeries
    x-required-role: READONLY
    # 一次取回多台实例的同一批指标。列表页当页 50 行原本是 50 个 series 请求，
    # 500 台时会打满后端连接池；这里合成一个往返。口径与单实例端点完全一致
    # （同一段代码），库级指标一律按目录里的聚合方式收敛成实例级——列表与总览
    # 不按库展开，所以这里没有 by_database。
    #
    # **两种寻址方式**：`metric` 是具体指标 ID，`slot` 是语义位。总览与实例列表只许用
    # `slot`（ADR-0001）：位按**每台实例自己的引擎**在服务端解析成指标 ID，所以接入第二个
    # 引擎时列表一行代码都不用改。至少给一个，两个都不给是 400。
    parameters:
      - name: instance_id
        in: query
        required: true
        description: 要取的实例，可重复。上限与列表页大小一致。
        schema:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
      - name: metric
        in: query
        required: false
        description: 具体指标 ID，可重复。与 slot 至少给一个。
        schema:
          type: array
          items: { $ref: ../components/enums.yaml#/MetricId }
      - name: slot
        in: query
        required: false
        description: >-
          语义位，可重复。逐台按实例自己的引擎解析成具体指标；该引擎没有绑定这个位时，
          响应里那一条带着 slot 与 NOT_APPLICABLE_ENGINE，而不是一个空指标 ID。
        schema:
          type: array
          items: { $ref: ../components/enums.yaml#/SemanticSlot }
      - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
      - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      - name: step
        in: query
        required: false
        description: 缺省 auto。
        schema: { $ref: ../components/enums.yaml#/MetricStep }
    responses:
      '200':
        description: Metric series for every requested instance
        content:
          application/json:
            schema: { $ref: ../components/schemas/metrics.yaml#/InstancesMetricSeriesResponse }
      '400':
        description: Invalid time range, step, instance list, or metric/slot selection
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
/api/v1/metrics/catalog:
  get:
    tags: [metrics]
    operationId: getMetricCatalog
    x-required-role: READONLY
    responses:
      '200':
        description: The metric catalogue and the semantic slots it fills
        content:
          application/json:
            schema: { $ref: ../components/schemas/metrics.yaml#/MetricCatalog }
