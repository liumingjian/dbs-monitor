/api/v1/instances/{id}/metrics/series:
  get:
    tags: [metrics]
    operationId: getMetricSeries
    x-required-role: READONLY
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: metric
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
            enum:
              - pg.availability.reachable
              - pg.probe.latency_ms
              - collector.last_success_time
              - agent.status
              - host.cpu.usage_percent
              - host.memory.usage_percent
              - host.disk.usage_percent
              - host.disk.free_bytes
              - host.disk.iops
              - host.disk.throughput_bytes_per_sec
              - host.network.bytes_per_sec
              - pg.connection.total
              - pg.connection.active
              - pg.connection.idle_in_transaction
              - pg.connection.max
              - pg.connection.saturation_percent
              - pg.tps
              - pg.xact.commit_per_sec
              - pg.xact.rollback_per_sec
              - pg.tuples.read_per_sec
              - pg.tuples.write_per_sec
              - pg.temp.files_per_sec
              - pg.temp.bytes_per_sec
              - pg.transaction.long_count
              - pg.transaction.max_duration_sec
              - pg.lock.waiting_count
              - pg.session.blocked_count
              - pg.query.long_running_count
              - pg.prepared_xacts.count
              - pg.replication.role
              - pg.replication.connection_state
              - pg.replication.replay_lag_ms
              - pg.replication.wal_lag_bytes
              - pg.replication_slot.retained_wal_bytes
              - pg.cache.hit_ratio
              - pg.cache.block_access_per_sec
              - pg.database.size_bytes
              - pg.deadlock.count
      - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
      - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      - name: step
        in: query
        required: false
        schema:
          type: string
          enum: [auto, 15s, 1m, 5m, raw]
          default: auto
      # 库级指标（TPS、提交回滚、元组读写、临时文件……）默认按目录里的聚合方式收敛成实例级的
      # 一条序列。置真则逐库展开，库名以 `database` 出现在序列的 labels 里——只有实例工作台
      # 会这么要，列表与总览一律看实例级值。实例级指标不受这个开关影响。
      - name: by_database
        in: query
        required: false
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Metric series
        content:
          application/json:
            schema: { $ref: ../components/schemas/metrics.yaml#/MetricSeriesResponse }
      '400':
        description: Invalid time range or step
        content:
          application/json:
            schema: { $ref: ../components/errors.yaml#/Error }
/api/v1/metrics/catalog:
  get:
    tags: [metrics]
    operationId: getMetricCatalog
    x-required-role: READONLY
    responses:
      '200':
        description: The metric catalogue and the semantic slots it fills
        content:
          application/json:
            schema: { $ref: ../components/schemas/metrics.yaml#/MetricCatalog }
