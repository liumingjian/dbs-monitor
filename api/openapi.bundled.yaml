      type: object
      required:
        - metric
        - value
      properties:
        metric:
          type: string
          enum:
            - host.cpu.usage_percent
            - host.memory.usage_percent
            - host.disk.usage_percent
            - host.disk.free_bytes
            - host.disk.iops
            - host.disk.throughput_bytes_per_sec
            - host.network.bytes_per_sec
        value:
          type: number
          format: double
    AgentSample:
      type: object
      required:
        - timestamp
        - metrics
      properties:
        timestamp:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/AgentMetric'
    AgentRegistrationState:
      type: string
      enum:
        - NEVER_REGISTERED
        - EXPECTED_ONLINE
        - REVOKED
        - DISABLED
    AgentInstallation:
      type: object
      required:
        - ca_fingerprint_sha256
        - installer_path
        - authentication_path
        - file_mode
        - restart_command
      properties:
        ca_fingerprint_sha256:
          type: string
          description: Lowercase SHA-256 fingerprint of the platform CA certificate in DER form.
        installer_path:
          type: string
        authentication_path:
          type: string
        file_mode:
          type: string
          enum:
            - '0600'
        restart_command:
          type: string
