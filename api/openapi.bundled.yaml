        source_template_version:
          type: integer
        enabled_updated_by:
          type: string
          format: uuid
        enabled_updated_at:
          type: string
          format: date-time
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertRuleEnabledInput:
