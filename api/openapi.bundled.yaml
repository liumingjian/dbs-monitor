openapi: 3.0.3
info:
  title: dbs-monitor API
  version: 0.1.0
servers:
  - url: /
tags:
  - name: instances
  - name: metrics
  - name: alert-rules
  - name: alerts
  - name: performance-events
  - name: auth
  - name: agent
  - name: collection
  - name: users
  - name: diagnostics
  - name: notification-settings
paths:
  /api/v1/login:
    post:
      tags:
        - auth
      operationId: createSession
      x-required-role: READONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '204':
          description: Logged in
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances:
    get:
      tags:
        - instances
      operationId: listInstances
      x-required-role: READONLY
      responses:
        '200':
          description: Instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instance'
    post:
      tags:
        - instances
      operationId: createInstance
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceCreateInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceCreated'
        '400':
          description: Connection test or version gate failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - instances
      operationId: getInstance
      x-required-role: READONLY
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
    put:
      tags:
        - instances
      operationId: updateInstance
      x-required-role: ALERT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceMetadataInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          description: Connection test failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - instances
      operationId: deleteInstance
      x-required-role: PLATFORM_ADMIN
      responses:
        '204':
          description: Deleted
  /api/v1/instances/{id}/credentials:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - instances
      operationId: updateInstanceCredential
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceCredentialInput'
      responses:
        '200':
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceCredentialUpdated'
        '400':
          description: Connection test failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{id}/metrics/series:
    get:
      tags:
        - metrics
      operationId: getMetricSeries
      x-required-role: READONLY
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: metric
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              enum:
                - pg.availability.reachable
                - pg.probe.latency_ms
                - collector.last_success_time
                - agent.status
                - host.cpu.usage_percent
                - host.memory.usage_percent
                - host.disk.usage_percent
                - host.disk.free_bytes
                - host.disk.iops
                - host.disk.throughput_bytes_per_sec
                - host.network.bytes_per_sec
                - pg.connection.total
                - pg.connection.active
                - pg.connection.idle_in_transaction
                - pg.tps
                - pg.xact.commit_per_sec
                - pg.xact.rollback_per_sec
                - pg.tuples.read_per_sec
                - pg.tuples.write_per_sec
                - pg.temp.files_per_sec
                - pg.temp.bytes_per_sec
                - pg.transaction.long_count
                - pg.transaction.max_duration_sec
                - pg.lock.waiting_count
                - pg.session.blocked_count
                - pg.query.long_running_count
                - pg.prepared_xacts.count
                - pg.replication.role
                - pg.replication.connection_state
                - pg.replication.replay_lag_ms
                - pg.replication.wal_lag_bytes
                - pg.replication_slot.retained_wal_bytes
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: step
          in: query
          required: false
          schema:
            type: string
            enum:
              - auto
              - 15s
              - 1m
              - 5m
              - raw
            default: auto
      responses:
        '200':
          description: Metric series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeriesResponse'
        '400':
          description: Invalid time range or step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{id}/collection/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - collection
      operationId: listCollectionTaskStates
      x-required-role: READONLY
      responses:
        '200':
          description: Collection task states and configured intervals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionTaskState'
  /api/v1/instances/{id}/collection/capabilities:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - collection
      operationId: listCapabilitySnapshot
      x-required-role: READONLY
      responses:
        '200':
          description: Current projected capability snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilitySnapshotEntry'
  /api/v1/instances/{id}/collection/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - collection
      operationId: getCollectionPause
      x-required-role: READONLY
      responses:
        '200':
          description: Current collection pause status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPauseStatus'
    put:
      tags:
        - collection
      operationId: updateCollectionPause
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPauseInput'
      responses:
        '200':
          description: Updated collection pause status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPauseStatus'
  /api/v1/instances/{id}/collection/tasks/{task_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          enum:
            - pg.probe
            - pg.stat_database
            - pg.stat_activity
            - pg.replication
            - pg.replication_slot
            - pg.prepared_xacts
            - pg.role
            - pg.stat_statements
    put:
      tags:
        - collection
      operationId: updateCollectionTaskInterval
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionTaskIntervalInput'
      responses:
        '200':
          description: Updated collection task state and configured interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionTaskState'
        '400':
          description: Invalid task or interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{id}/long-query-samples:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sort
        in: query
        schema:
          type: string
          enum:
            - sampled_at
            - '-sampled_at'
            - query_started_at
            - '-query_started_at'
          default: '-sampled_at'
    get:
      tags:
        - collection
      operationId: listLongQuerySamples
      x-required-role: READONLY
      responses:
        '200':
          description: Long-query samples captured from pg_stat_activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LongQuerySamplePage'
        '400':
          description: Invalid time range or pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{id}/query-stats:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - collection
      operationId: getQueryStatisticsSnapshot
      x-required-role: READONLY
      responses:
        '200':
          description: Latest query statistics snapshot or an explicit unavailability reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStatisticsSnapshot'
  /api/v1/instances/{id}/sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - collection
      operationId: getSessionSnapshot
      x-required-role: READONLY
      responses:
        '200':
          description: Latest successful pg_stat_activity session snapshot with a server-enforced hard cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshot'
  /api/v1/alert-rules:
    get:
      tags:
        - alert-rules
      operationId: listAlertRules
      x-required-role: READONLY
      responses:
        '200':
          description: Alert rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
    post:
      tags:
        - alert-rules
      operationId: createAlertRule
      x-required-role: ALERT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Invalid alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - alert-rules
      operationId: getAlertRule
      x-required-role: READONLY
      responses:
        '200':
          description: Alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '404':
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - alert-rules
      operationId: updateAlertRule
      x-required-role: ALERT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '200':
          description: Updated alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Invalid alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - alert-rules
      operationId: deleteAlertRule
      x-required-role: ALERT_ADMIN
      responses:
        '204':
          description: Deleted
        '404':
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Built-in alert rules cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-rules/{id}/enabled:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - alert-rules
      operationId: updateAlertRuleEnabled
      x-required-role: ALERT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleEnabledInput'
      responses:
        '200':
          description: Updated alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Invalid enablement request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-rules/{id}/copies:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - alert-rules
      operationId: copyAlertRule
      x-required-role: ALERT_ADMIN
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleCopyInput'
      responses:
        '201':
          description: Copied alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Invalid copied rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-rule-templates:
    get:
      tags:
        - alert-rules
      operationId: listAlertRuleTemplates
      x-required-role: READONLY
      responses:
        '200':
          description: Read-only built-in alert rule templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRuleTemplate'
  /api/v1/alert-rule-templates/{id}/alert-rules:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    post:
      tags:
        - alert-rules
      operationId: createAlertRuleFromTemplate
      x-required-role: ALERT_ADMIN
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleTemplateInstantiationInput'
      responses:
        '201':
          description: Created from template defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Invalid template overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Alert rule template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-instances/{id}/disposition:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - alerts
      operationId: getAlertDisposition
      x-required-role: READONLY
      responses:
        '200':
          description: Current disposition and complete disposition history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDispositionDetail'
        '404':
          description: Alert instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - alerts
      operationId: updateAlertDisposition
      x-required-role: ALERT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDispositionInput'
      responses:
        '200':
          description: Updated disposition and complete disposition history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDispositionDetail'
        '400':
          description: Invalid disposition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Alert instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Recovered alert instances cannot be disposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alerts/current:
    get:
      tags:
        - alerts
      operationId: listCurrentAlerts
      x-required-role: READONLY
      parameters:
        - name: instance_id
          in: query
          schema:
            type: string
            format: uuid
        - name: include_paused
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Current alert instances, excluding paused frozen alerts by default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertObservationPage'
        '400':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alerts/history:
    get:
      tags:
        - alerts
      operationId: listAlertHistory
      x-required-role: READONLY
      parameters:
        - name: instance_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Recovered alert instance history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertObservationPage'
        '400':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-instances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - alerts
      operationId: getAlertDetail
      x-required-role: READONLY
      responses:
        '200':
          description: Alert observation detail and rule version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '404':
          description: Alert instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-instances/{id}/trigger-snapshot:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - alerts
      operationId: getAlertTriggerSnapshot
      x-required-role: READONLY
      responses:
        '200':
          description: Trigger-time session snapshot result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertTriggerSnapshot'
        '404':
          description: Alert instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-instances/{id}/notifications:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - alerts
      operationId: listAlertNotifications
      x-required-role: READONLY
      responses:
        '200':
          description: Notification delivery and attempt records for one alert instance.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationAttempt'
  /api/v1/notification-channels/smtp:
    get:
      tags:
        - notification-settings
      operationId: getSMTPChannel
      x-required-role: READONLY
      responses:
        '200':
          description: Singleton SMTP channel; an unconfigured channel is a value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMTPChannel'
    put:
      tags:
        - notification-settings
      operationId: updateSMTPChannel
      x-required-role: ALERT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMTPChannelInput'
      responses:
        '200':
          description: Updated SMTP channel without authentication material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMTPChannel'
        '400':
          description: Invalid SMTP configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/notification-channels/smtp/test:
    post:
      tags:
        - notification-settings
      operationId: testSMTPChannel
      x-required-role: ALERT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMTPTestInput'
      responses:
        '202':
          description: Test delivery was durably queued through the normal delivery path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationQueued'
        '400':
          description: SMTP is not configured or the target is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{id}/performance-events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: recovered
        in: query
        schema:
          type: boolean
      - name: disposition
        in: query
        schema:
          $ref: '#/components/schemas/AlertDisposition'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sort
        in: query
        schema:
          type: string
          enum:
            - derived_at
            - '-derived_at'
            - updated_at
            - '-updated_at'
          default: '-derived_at'
    get:
      tags:
        - performance-events
      operationId: listPerformanceEvents
      x-required-role: READONLY
      responses:
        '200':
          description: Performance events derived from alert instances
          content:
