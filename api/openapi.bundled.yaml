openapi: 3.0.3
info:
  title: dbs-monitor API
  version: 0.1.0
servers:
  - url: /
tags:
  - name: instances
  - name: metrics
  - name: alert-rules
  - name: auth
  - name: agent
  - name: collection
  - name: users
paths:
  /api/v1/login:
    post:
      tags:
        - auth
      operationId: createSession
      x-required-role: READONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '204':
          description: Logged in
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances:
    get:
      tags:
        - instances
      operationId: listInstances
      x-required-role: READONLY
      responses:
        '200':
          description: Instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instance'
    post:
      tags:
        - instances
      operationId: createInstance
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceCreated'
  /api/v1/instances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - instances
      operationId: getInstance
      x-required-role: READONLY
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
    put:
      tags:
        - instances
      operationId: updateInstance
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
    delete:
      tags:
        - instances
      operationId: deleteInstance
      x-required-role: PLATFORM_ADMIN
      responses:
        '204':
          description: Deleted
  /api/v1/instances/{id}/metrics/series:
    get:
      tags:
        - metrics
      operationId: getMetricSeries
      x-required-role: READONLY
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: metric
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              enum:
                - pg.availability.reachable
                - pg.probe.latency_ms
                - collector.last_success_time
                - agent.status
                - host.cpu.usage_percent
                - host.memory.usage_percent
                - host.disk.usage_percent
                - host.disk.free_bytes
                - host.disk.iops
                - host.disk.throughput_bytes_per_sec
                - host.network.bytes_per_sec
                - pg.connection.total
                - pg.connection.active
                - pg.connection.idle_in_transaction
                - pg.tps
                - pg.xact.commit_per_sec
                - pg.xact.rollback_per_sec
                - pg.tuples.read_per_sec
                - pg.tuples.write_per_sec
                - pg.temp.files_per_sec
                - pg.temp.bytes_per_sec
                - pg.transaction.long_count
                - pg.transaction.max_duration_sec
                - pg.lock.waiting_count
                - pg.session.blocked_count
                - pg.query.long_running_count
                - pg.prepared_xacts.count
                - pg.replication.role
                - pg.replication.connection_state
                - pg.replication.replay_lag_ms
                - pg.replication.wal_lag_bytes
                - pg.replication_slot.retained_wal_bytes
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: step
          in: query
          required: false
          schema:
            type: string
            enum:
              - auto
              - 15s
              - 1m
              - 5m
              - raw
            default: auto
      responses:
        '200':
          description: Metric series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeriesResponse'
        '400':
          description: Invalid time range or step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{id}/collection/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - collection
      operationId: listCollectionTaskStates
      x-required-role: READONLY
      responses:
        '200':
          description: Collection task states and configured intervals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionTaskState'
  /api/v1/instances/{id}/collection/capabilities:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - collection
      operationId: listCapabilitySnapshot
      x-required-role: READONLY
      responses:
        '200':
          description: Current projected capability snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilitySnapshotEntry'
  /api/v1/instances/{id}/collection/tasks/{task_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          enum:
            - pg.probe
            - pg.stat_database
            - pg.stat_activity
            - pg.replication
            - pg.replication_slot
            - pg.prepared_xacts
            - pg.role
            - pg.stat_statements
    put:
      tags:
        - collection
      operationId: updateCollectionTaskInterval
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionTaskIntervalInput'
      responses:
        '200':
          description: Updated collection task state and configured interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionTaskState'
        '400':
          description: Invalid task or interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alert-rules:
    get:
      tags:
        - alert-rules
      operationId: listAlertRules
      x-required-role: READONLY
      responses:
        '200':
          description: Alert rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
    post:
      tags:
        - alert-rules
      operationId: createAlertRule
      x-required-role: ALERT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Invalid alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/agent/v1/report:
    post:
      tags:
        - agent
      operationId: reportAgentMetrics
      x-required-role: AGENT
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentReport'
      responses:
        '204':
          description: Accepted
        '400':
          description: Report rejected because of clock skew or Agent version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me:
    get:
      tags:
        - users
      operationId: getCurrentUser
      x-required-role: READONLY
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v1/users:
    get:
      tags:
        - users
      operationId: listUsers
      x-required-role: READONLY
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - users
      operationId: createUser
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: User created; the generated password is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          description: Invalid username or role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - users
      operationId: updateUserStatus
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Guard rejected the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - users
      operationId: updateUserRole
      x-required-role: PLATFORM_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Guard rejected the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - users
      operationId: resetUserPassword
      x-required-role: PLATFORM_ADMIN
      responses:
        '200':
          description: Password reset; the generated password is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordIssued'
        '400':
          description: Self-reset is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/password:
    put:
      tags:
        - users
      operationId: changeOwnPassword
      x-required-role: READONLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeInput'
      responses:
        '204':
          description: Password changed
        '400':
          description: Invalid old password or new password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
  schemas:
    Unavailability:
      type: string
      enum:
        - NO_SAMPLES_YET
        - NO_DATA_IN_RANGE
        - STALE
        - COLLECTION_PAUSED
        - COLLECTION_FAILED
        - DB_UNREACHABLE
        - AGENT_OFFLINE
        - PERMISSION_DENIED
        - EXTENSION_MISSING
        - FEATURE_DISABLED
        - VERSION_UNSUPPORTED
        - NOT_APPLICABLE_ROLE
        - COUNTER_RESET
    AlertStatus:
      type: string
      enum:
        - OK
        - PENDING
        - FIRING
        - NO_DATA
        - RECOVERED
    CapabilityStatus:
      type: string
      enum:
        - PRESENT
        - MISSING
        - NOT_APPLICABLE
        - UNKNOWN
    AlertAggregation:
      type: string
      enum:
        - latest
        - avg
        - max
        - min
        - sum
        - count
    AlertOperator:
      type: string
      enum:
        - '>'
        - '>='
        - <
        - <=
        - '='
        - '!='
      x-enum-varnames:
        - GreaterThan
        - GreaterThanEqual
        - LessThan
        - LessThanEqual
        - Equal
        - NotEqual
    AlertSeverity:
      type: string
      enum:
        - critical
        - warning
        - info
    NoDataPolicy:
      type: string
      enum:
        - ignore
        - mark_no_data
    AlertRuleInput:
      type: object
      required:
        - name
        - metric_id
        - aggregation
        - operator
        - threshold
        - recovery_operator
        - recovery_threshold
        - window_seconds
        - consecutive_count
        - recovery_consecutive_count
        - severity
        - no_data_policy
        - enabled
      properties:
        name:
          type: string
          minLength: 1
        metric_id:
          type: string
          minLength: 1
        aggregation:
          $ref: '#/components/schemas/AlertAggregation'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
          format: double
        recovery_operator:
          $ref: '#/components/schemas/AlertOperator'
        recovery_threshold:
          type: number
          format: double
        window_seconds:
          type: integer
          minimum: 1
        consecutive_count:
          type: integer
          minimum: 1
        recovery_consecutive_count:
          type: integer
          minimum: 1
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        no_data_policy:
          $ref: '#/components/schemas/NoDataPolicy'
        enabled:
          type: boolean
    AlertRule:
      type: object
      required:
        - id
        - name
        - metric_id
        - aggregation
        - operator
        - threshold
        - recovery_operator
        - recovery_threshold
        - window_seconds
        - consecutive_count
        - recovery_consecutive_count
        - severity
        - no_data_policy
        - enabled
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metric_id:
          type: string
        aggregation:
          $ref: '#/components/schemas/AlertAggregation'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
          format: double
        recovery_operator:
          $ref: '#/components/schemas/AlertOperator'
        recovery_threshold:
          type: number
          format: double
        window_seconds:
          type: integer
        consecutive_count:
          type: integer
        recovery_consecutive_count:
          type: integer
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        no_data_policy:
          $ref: '#/components/schemas/NoDataPolicy'
        enabled:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InstanceInput:
      type: object
      required:
        - name
        - host
        - port
        - database
        - username
        - password
      properties:
        name:
          type: string
          minLength: 1
        host:
          type: string
          minLength: 1
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    Instance:
      type: object
      required:
        - id
        - name
        - host
        - port
        - database
        - username
        - alert_status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        database:
          type: string
        username:
          type: string
        agent_version:
          type: string
          description: Version reported by the Agent, when one has reported.
        alert_status:
          $ref: '#/components/schemas/AlertStatus'
    InstanceCreated:
      type: object
      required:
        - instance
        - agent_token
      properties:
        instance:
          $ref: '#/components/schemas/Instance'
        agent_token:
          type: string
          description: Returned once when the instance is created.
    CollectionTaskState:
      type: object
      required:
        - task_id
        - kind
        - interval_seconds
        - consecutive_failures
      properties:
        task_id:
          type: string
          enum:
            - pg.probe
            - pg.stat_database
            - pg.stat_activity
            - pg.replication
            - pg.replication_slot
            - pg.prepared_xacts
            - pg.role
            - pg.stat_statements
        kind:
          type: string
          enum:
            - probe
            - sql
            - agent-derived
        interval_seconds:
          type: integer
          minimum: 5
        last_due_at:
          type: string
          format: date-time
        last_started_at:
          type: string
          format: date-time
        last_finished_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_result:
          $ref: '#/components/schemas/CollectionTaskResult'
        consecutive_failures:
          type: integer
          minimum: 0
        next_eligible_at:
          type: string
          format: date-time
        last_error_code:
          type: string
        last_error_message:
          type: string
    CollectionTaskIntervalInput:
      type: object
      required:
        - interval_seconds
      properties:
        interval_seconds:
          type: integer
          minimum: 5
    CapabilitySnapshotEntry:
      type: object
      required:
        - capability_id
        - class
        - status
        - affected_metric_count
      properties:
        capability_id:
          type: string
          enum:
            - role.pg_monitor
            - ext.pg_stat_statements
            - topo.has_replication
            - topo.has_slot
        class:
          type: string
          enum:
            - fixable
            - structural
        status:
          $ref: '#/components/schemas/CapabilityStatus'
        observed_at:
          type: string
          format: date-time
        fix_hint:
          type: string
        na_reason:
          type: string
        affected_metric_count:
          type: integer
          minimum: 0
    MetricSeriesResponse:
      type: object
      required:
        - from
        - to
        - step
        - metrics
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        step:
          type: string
        metrics:
          type: array
          items:
            type: object
            required:
              - metric
              - unit
              - unavailability
              - series
            properties:
              metric:
                type: string
              unit:
                type: string
              unavailability:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Unavailability'
              series:
                type: array
                items:
                  type: object
                  required:
                    - labels
                    - points
                  properties:
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    points:
                      type: array
                      items:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items:
                          type: number
                          nullable: true
                          x-go-type: '*float64'
    AgentReport:
      type: object
      required:
        - instance_id
        - agent_version
        - timestamp
        - metrics
      properties:
        instance_id:
          type: string
          format: uuid
        agent_version:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/AgentMetric'
        backfill:
          type: array
          description: Unacknowledged samples from the Agent's five-minute in-memory window.
          items:
            $ref: '#/components/schemas/AgentSample'
    Role:
      type: string
      enum:
        - READONLY
        - ALERT_ADMIN
        - PLATFORM_ADMIN
    User:
      type: object
      required:
        - id
        - username
        - role
        - enabled
        - created_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserCreateInput:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
    UserCreated:
      type: object
      required:
        - user
        - initial_password
      properties:
        user:
          $ref: '#/components/schemas/User'
        initial_password:
          type: string
          description: Generated password returned only in this response.
    UserStatusInput:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    UserRoleInput:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
    PasswordIssued:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: Generated password returned only in this response.
    PasswordChangeInput:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 12
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INTERNAL
            message:
              type: string
            field_errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
    CollectionTaskResult:
      type: string
      enum:
        - SUCCESS
        - FAILED
        - TIMED_OUT
        - SKIPPED_BACKPRESSURE
        - BACKOFF
    AgentMetric:
      type: object
      required:
        - metric
        - value
      properties:
        metric:
          type: string
          enum:
            - host.cpu.usage_percent
            - host.memory.usage_percent
            - host.disk.usage_percent
            - host.disk.free_bytes
            - host.disk.iops
            - host.disk.throughput_bytes_per_sec
            - host.network.bytes_per_sec
        value:
          type: number
          format: double
    AgentSample:
      type: object
      required:
        - timestamp
        - metrics
      properties:
        timestamp:
          type: string
          format: date-time
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/AgentMetric'
