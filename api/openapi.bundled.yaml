components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
  schemas:
    Unavailability:
      type: string
      enum:
        - NO_SAMPLES_YET
        - NO_DATA_IN_RANGE
        - STALE
        - COLLECTION_PAUSED
        - COLLECTION_FAILED
        - DB_UNREACHABLE
        - AGENT_OFFLINE
        - PERMISSION_DENIED
        - EXTENSION_MISSING
        - FEATURE_DISABLED
        - VERSION_UNSUPPORTED
        - NOT_APPLICABLE_ROLE
        - COUNTER_RESET
    AlertStatus:
      type: string
      enum:
        - OK
        - PENDING
        - FIRING
        - NO_DATA
        - RECOVERED
    HealthStatus:
      type: string
      enum:
        - CRITICAL
        - WARNING
        - UNKNOWN
        - HEALTHY
        - PAUSED
      x-enum-varnames:
        - HealthCritical
        - HealthWarning
        - HealthUnknown
        - HealthHealthy
        - HealthPaused
    InstanceAgentStatus:
      type: string
      enum:
        - offline
        - online
        - not_installed
        - permission_denied
        - error
      x-enum-varnames:
        - InstanceAgentOffline
        - InstanceAgentOnline
        - InstanceAgentNotInstalled
        - InstanceAgentPermissionDenied
        - InstanceAgentError
    CapabilityStatus:
      type: string
      enum:
        - PRESENT
        - MISSING
        - NOT_APPLICABLE
        - UNKNOWN
    AlertAggregation:
      type: string
      enum:
        - latest
        - avg
        - max
        - min
        - sum
        - count
    AlertOperator:
      type: string
      enum:
        - '>'
        - '>='
        - <
        - <=
        - '='
        - '!='
      x-enum-varnames:
        - GreaterThan
        - GreaterThanEqual
        - LessThan
        - LessThanEqual
        - Equal
        - NotEqual
    AlertSeverity:
      type: string
      enum:
        - critical
        - warning
        - info
    NoDataPolicy:
      type: string
      enum:
        - ignore
        - mark_no_data
    AlertRuleScope:
      type: string
      enum:
        - ALL
        - INSTANCES
    PlatformHealthStatus:
      type: string
      enum:
        - OK
        - DEGRADED
        - FAILED
        - UNKNOWN
      x-enum-varnames:
        - PlatformHealthOK
        - PlatformHealthDegraded
        - PlatformHealthFailed
        - PlatformHealthUnknown
    PlatformHealthSource:
      type: string
      enum:
        - SERVER_PROCESS
        - PLATFORM_DATABASE
        - COLLECTION_SCHEDULER
        - PARTITION_MAINTENANCE
        - TLS_CERTIFICATE
        - AGENT_INGRESS
        - DISK
        - CREDENTIAL_KEYRING
      x-enum-varnames:
        - HealthSourceServerProcess
        - HealthSourcePlatformDatabase
        - HealthSourceCollectionScheduler
        - HealthSourcePartitionMaintenance
        - HealthSourceTLSCertificate
        - HealthSourceAgentIngress
        - HealthSourceDisk
        - HealthSourceCredentialKeyring
    AlertDisposition:
      type: string
      enum:
        - NONE
        - ACKED
        - IGNORED
    IgnoreReasonCode:
      type: string
      enum:
        - KNOWN_ISSUE
        - FALSE_POSITIVE
        - DUPLICATE
        - IMPACT_ACCEPTABLE
        - OTHER
    AlertRuleInput:
      type: object
      required:
        - name
        - metric_id
        - aggregation
        - operator
        - threshold
        - recovery_operator
        - recovery_threshold
        - window_seconds
        - consecutive_count
        - severity
        - no_data_policy
        - scope
        - instance_ids
        - evaluation_interval_seconds
        - enabled
      properties:
        name:
          type: string
          minLength: 1
        metric_id:
          type: string
          minLength: 1
        aggregation:
          $ref: '#/components/schemas/AlertAggregation'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
          format: double
        recovery_operator:
          $ref: '#/components/schemas/AlertOperator'
        recovery_threshold:
          type: number
          format: double
          x-go-type: '*float64'
        window_seconds:
          type: integer
          minimum: 1
        consecutive_count:
          type: integer
          minimum: 1
        recovery_consecutive_count:
          type: integer
          minimum: 1
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        no_data_policy:
          $ref: '#/components/schemas/NoDataPolicy'
        scope:
          $ref: '#/components/schemas/AlertRuleScope'
        instance_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        evaluation_interval_seconds:
          type: integer
          minimum: 5
        enabled:
          type: boolean
        notification_policy_id:
          type: string
          format: uuid
    AlertRule:
      type: object
      required:
        - id
        - name
        - metric_id
        - aggregation
        - operator
        - threshold
        - recovery_operator
        - recovery_threshold
        - window_seconds
        - consecutive_count
        - recovery_consecutive_count
        - severity
        - no_data_policy
        - scope
        - instance_ids
        - evaluation_interval_seconds
        - enabled
        - is_builtin
        - effective_notification_policy_name
        - current_alert_count
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metric_id:
          type: string
        aggregation:
          $ref: '#/components/schemas/AlertAggregation'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
          format: double
        recovery_operator:
          $ref: '#/components/schemas/AlertOperator'
        recovery_threshold:
          type: number
          format: double
        window_seconds:
          type: integer
        consecutive_count:
          type: integer
        recovery_consecutive_count:
          type: integer
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        no_data_policy:
          $ref: '#/components/schemas/NoDataPolicy'
        scope:
          $ref: '#/components/schemas/AlertRuleScope'
        instance_ids:
          type: array
          items:
            type: string
            format: uuid
        evaluation_interval_seconds:
          type: integer
        enabled:
          type: boolean
        is_builtin:
