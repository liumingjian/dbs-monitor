x-monitored: &monitored
  profiles: [matrix]
  environment:
    POSTGRES_DB: monitored
    POSTGRES_USER: monitored
    POSTGRES_PASSWORD: monitored
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U monitored -d monitored"]
    interval: 1s
    timeout: 3s
    retries: 30

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dbs_monitor
      POSTGRES_USER: dbs_monitor
      POSTGRES_PASSWORD: dbs_monitor
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbs_monitor -d dbs_monitor"]
      interval: 1s
      timeout: 3s
      retries: 30

  monitored-pg13:
    <<: *monitored
    image: postgres:13
    ports: ["55433:5432"]
  monitored-pg14:
    <<: *monitored
    image: postgres:14
    ports: ["55434:5432"]
  monitored-pg15:
    <<: *monitored
    image: postgres:15
    ports: ["55435:5432"]
  monitored-pg16:
    <<: *monitored
    image: postgres:16
    ports: ["55436:5432"]
  monitored-pg17:
    <<: *monitored
    image: postgres:17
    ports: ["55437:5432"]

  monitored-pg17-replica:
    <<: *monitored
    image: postgres:17
    environment:
      PGPASSWORD: monitored
    ports: ["55438:5432"]
    depends_on:
      monitored-pg17:
        condition: service_healthy
    entrypoint:
      - bash
      - -ec
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          until pg_isready -h monitored-pg17 -U monitored -d monitored; do sleep 1; done
          gosu postgres pg_basebackup -h monitored-pg17 -D "$$PGDATA" -U monitored -Fp -Xs -R
        fi
        exec gosu postgres postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test "$$(psql -U monitored -d monitored -tAc ''SELECT status FROM pg_stat_wal_receiver'')" = streaming',
        ]
      interval: 1s
      timeout: 3s
      retries: 30
