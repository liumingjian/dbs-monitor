# v1 验收矩阵 · 骨架
#
# 本文件由 #111 生成骨架，逐条内容由 #118 / #119 / #120 / #121 填入。
#
# 硬底：九片 × 5 条基线（S1 + F1..F4）= 45 条，加 7 条横切，加逐条票定稿的加深基线。
# A 组（#118，片01/07/09）定稿 8 条加深基线，硬底因此为 60。B/C/D 组（#119/#120/#121）
# 若再定加深基线，同样只增不减。
# B 组（#119，片02/03/04）定稿 7 条加深基线，硬底累加至 67。
# C 组（#120，片05/06）定稿 4 条加深基线，硬底累加至 71。
# D 组（#121，片08 + 横切组）定稿 7 条加深基线，硬底累加至 78。四票定稿完毕，片条目硬底 78。
# 恢复门横切组 REC-1..10（#113）新增 10 条全基线，硬底 78 → 88、条目 81 → 91。
# 它是矩阵上第二个横切组，独立计分。
# 外部前置 PG 的前置校验（#116）追加 REC-11..13 进同一横切组（不开第三组），硬底 88 → 91、
# 条目 91 → 94。
# 新增 after 字段（26 号 D8）：只记执行序依赖，与 rides_on（搭车执行）语义不同，不得混用。
# 横切条目新增 rides_on 字段（24 号 D7）：横切自带断言集与 test_ref 独立计分，
# rides_on 只记账它搭在哪次执行现场上；crosscut 写在片条目上是覆盖维，两者不互为反向索引。
# 执行序两条硬约束（24 号 D1/D14）：AC-08-S1 最先（全矩阵接入前置），AC-08-S7 最末（停 server 跑离线轮换）。
# 生产安全边界横切组 SEC-1..10（#112）是矩阵上第三个横切组，10 条全基线，独立计分，
# 硬底 91 → 101、条目 94 → 104。
# 不并进 REC 组：REC 的组名语义是恢复门（26 号 D1），安全边界不同轴，并进去会让组名说谎。
# 执行序全序（26 号 D7，经 29 号 D8.2 改写）：AC-08-S1 最先 → 其余片条目 → REC-* → SEC-* → AC-08-S7 最末。
# SEC 组内 SEC-3/4/5 要求 server 以不同证书或配置重启，用 after 压到组尾。
# baseline: true 的条目不许 pending；n-a 必须写 reason。
# 说明：实现落地前 baseline 条目以 pending 占位；v1 判定时 baseline 仍为 pending 即未达标。
# test_ref 规范（#118 定）：值必须内含条目 ID 字面量 —— Go 用 TestAcceptance_AC_01_S1 形，
# Playwright 用 [AC-07-F2] 前缀形，使 B12 漂移门退化为单条 grep。
# 片⑩（发布收口）不出条目，其内容归 #110 / #114。

version: 1

