# v1 验收矩阵 · 骨架
#
# 规则与字段定义：docs/design/20-v1-acceptance-matrix.md（决策票 #111）
# 本文件由 #111 生成骨架，逐条内容由 #118 / #119 / #120 / #121 填入。
#
# 硬底：九片 × 5 条基线（S1 + F1..F4）= 45 条，加 7 条横切，加逐条票定稿的加深基线。
# A 组（#118，片01/07/09）定稿 8 条加深基线，硬底因此为 60 —— 出处与理由见
# docs/design/21-v1-acceptance-entries-a.md D1/D2/D4/D6。B/C/D 组（#119/#120/#121）
# 若再定加深基线，同样只增不减，各自在自己的决策记录里交代。
# B 组（#119，片02/03/04）定稿 7 条加深基线，硬底累加至 67 —— 出处与理由见
# docs/design/22-v1-acceptance-entries-b.md D1–D7。
# baseline: true 的条目不许 pending；n-a 必须写 reason。
# 说明：实现落地前 baseline 条目以 pending 占位；v1 判定时 baseline 仍为 pending 即未达标。
# test_ref 规范（#118 定）：值必须内含条目 ID 字面量 —— Go 用 TestAcceptance_AC_01_S1 形，
# Playwright 用 [AC-07-F2] 前缀形，使 B12 漂移门退化为单条 grep。
# 片⑩（发布收口）不出条目，其内容归 #110 / #114。

version: 1
spec: docs/spec/mvp-master-spec.md
rules: docs/design/20-v1-acceptance-matrix.md

# D4 白名单：绕过业务 API 的数据准备，逐条登记理由。默认为空。
exceptions: []

entries:
  # ── 片01 · 采集与指标全量
  - id: AC-01-S1
    slice: "01"
    kind: S1
    baseline: true
    title: "端到端成功路径：经业务 API 建实例 → 真实 Task 采集 → 指标序列出点"
    layer: api
    asserts:
      - "实例经 createInstance 创建，全程无业务表直写（B11）"
      - "≤2×采集周期内 metric_sample 出现该实例的真实样本（由真实 Task 产出）"
      - "getMetricSeries 返回绝对时间桶，无补 0 桶"
      - "collector.last_success_time 完整性水位随全部当期义务满足而推进"
    pages: ["实例工作台/监控与报警/标准监控"]
    operations: [createInstance, getMetricSeries, listInstanceCollectionTasks]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿；实现归片①实现票，届时置 covered 并填 test_ref"
  - id: AC-01-S2
    slice: "01"
    kind: S2
    baseline: true
    title: "全字典对账：每项 P0 指标要么有真实样本，要么显式降级到封闭 13 码，无第三种结局"
    layer: api
    asserts:
      - "遍历 R1 字典全部 P0 指标，逐项二分判定：有真实样本 OR 带封闭 13 码之一的显式降级"
      - "不存在既无样本又无原因码的指标（第三种结局即红）"
      - "降级项的码与该指标所属 Task.Requires 的能力快照事实一致，不得自相矛盾"
      - "指标枚举由字典单一来源生成，与 OpenAPI 枚举一致"
    pages: []
    operations: [getMetricSeries, listInstanceCapabilities]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "S1 拍板验收判据原文（片①Further Notes），按 21 号 D1 设为加深基线，不许 pending 落地后必须 covered"
  - id: AC-01-F1
    slice: "01"
    kind: F1
    baseline: true
    title: "权限拒绝：三档角色 × 任务采样周期写端点"
    layer: api
    asserts:
      - "三档角色账号一律经用户管理 API 创建（D9），不直插 user 表"
      - "只读运维、告警管理员调 updateCollectionTaskInterval 得规定拒绝语义，非 500、非静默成功"
      - "平台管理员调用成功，且 UI 读回的周期恒等于配置值"
    pages: []
    operations: [updateCollectionTaskInterval]
    crosscut: [INV-3]
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿"
  - id: AC-01-F2
    slice: "01"
    kind: F2
    baseline: true
    title: "空状态用户可见路径：IA §6.5 从空图表一路走到采集管理的受影响指标"
    layer: browser
    asserts:
      - "空图表渲染 13 码之一的原因文案，绝不渲染成 0（B6）"
      - "缺桶不补 0，曲线断开而非落到零线"
      - "dataUpdatedAt 数据新鲜度可见（B6）"
      - "时间范围与筛选走 search params 往返（B6）"
      - "从空图表可跳转至采集管理页，并定位到受影响指标行（IA §6.5 全路径）"
    pages: ["实例工作台/监控与报警/标准监控", "实例工作台/采集管理/指标采集状态"]
    operations: [getMetricSeries, listInstanceCapabilities, listInstanceCollectionTasks]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "本组唯一命中 IA §6 关键路径的条目（§6.5），按 21 号 D3 由本条承载整条路径"
  - id: AC-01-F3
    slice: "01"
    kind: F3
    baseline: true
    title: "能力不足降级：真实回收 pg_monitor → MISSING + 修复指引 + 影响 N 项指标"
    layer: api
    asserts:
      - "以真实 SQL 回收监控账号的 pg_monitor 角色（真实手段，非 mock、非直改状态表）"
      - "能力快照 role.pg_monitor = MISSING 且 Class=fixable，附 FixHint"
      - "「影响 N 项指标」沿 Task.Requires 反查得出，无第二张映射表"
      - "受影响指标序列返回 PERMISSION_DENIED，不得表现为「有数据但全零」"
    pages: []
    operations: [listInstanceCapabilities, getMetricSeries]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿"
  - id: AC-01-F4
    slice: "01"
    kind: F4
    baseline: true
    title: "平台自身故障不污染目标侧：平台库不可达期间零告警实例、零 NO_DATA、零样本"
    layer: api
    asserts:
      - "注入平台库不可达（真停平台 PG 容器，与 AC-09-F4 同一手法）"
      - "目标实例侧零新增告警实例、零 NO_DATA"
      - "metric_sample 该实例零新增行（DB 层只读计数，前后对比）"
      - "平台库恢复后采集继续，不补跑、不造占位样本"
    pages: []
    operations: [getMetricSeries]
    crosscut: [INV-4]
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿"
  - id: AC-01-F5
    slice: "01"
    kind: F5
    baseline: true
    title: "目标库不可达：DB_UNREACHABLE + 能力快照整份 UNKNOWN（不是空清单、不是 MISSING）"
    layer: api
    asserts:
      - "真停目标库容器（真实手段）"
      - "指标序列返回 DB_UNREACHABLE"
      - "能力快照整份投影 UNKNOWN，绝不反推为 MISSING，绝不呈现为空清单"
      - "探针 reachable=false 与「平台过载跳过」在任务状态上可区分（跳过不写 reachable=false）"
    pages: []
    operations: [getMetricSeries, listInstanceCapabilities, listInstanceCollectionTasks]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "能力四态的 UNKNOWN 态与不可达故障合并进 F3 会变成两次执行；按 21 号 D2 拆出并设为加深基线"
  - id: AC-01-F6
    slice: "01"
    kind: F6
    baseline: true
    title: "结构性不适用：主库上的复制延迟与无 slot，均为 NOT_APPLICABLE 而非 0"
    layer: api
    asserts:
      - "主库实例上复制延迟类指标返回 NOT_APPLICABLE_ROLE 并附 NAReason，不报错、不空白"
      - "无 replication slot 时呈现「不适用」，与真实积压 0 字节严格可区分"
      - "topo.has_replication / topo.has_slot 能力 Class=structural，不进配置缺失待办"
    pages: []
    operations: [getMetricSeries, listInstanceCapabilities]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "同 AC-01-F5，四态的 NOT_APPLICABLE 态独立成条，加深基线不许 pending"
  # ── 片02 · 告警规则与评估
  - id: AC-02-S1
    slice: "02"
    kind: S1
    baseline: true
    title: "端到端成功路径：自建规则跑通 OK → PENDING → FIRING → RECOVERED，含强制滞回"
    layer: api
    asserts:
      - "经 createAlertRule 建单指标单条件规则（触发阈值 3、恢复阈值 1、consecutive_count 2），全程无业务表直写（B11）"
      - "对目标库真实开 5 条连接，pg.connection.total 由真实采集管线越过阈值（不直插样本）"
      - "状态序列 OK → PENDING → FIRING，PENDING 需连续 2 个评估周期，单次抖动不进 PENDING"
      - "断到 1 条连接：越过独立恢复阈值后才 RECOVERED；触发阈值与恢复阈值之间的取值不产生任何状态迁移（滞回成立）"
      - "AlertEvent 序列 PENDING_STARTED → FIRED → RECOVERED 齐全，各带 rule_version 与规则快照字段"
      - "同一去重键（rule_id + resource_id + metric_dimension）未恢复前只有一条告警实例"
    pages: ["实例工作台/监控与报警/告警规则"]
    operations: [createAlertRule, listAlertRules, listAlertInstances, listAlertEvents]
    crosscut: [INV-1]
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "条目内容由 #119 定稿；实现归片②实现票，届时置 covered 并填 test_ref"
  - id: AC-02-S2
    slice: "02"
    kind: S2
    baseline: true
    title: "规则版本快照：下一次评估生效、重置未完成计数、不回放不重算"
    layer: api
    asserts:
      - "对一条 FIRING 中的规则改阈值：产生新 version，实例 ID 与首次触发时间保持不变"
      - "新配置从下一次评估起生效，保存瞬间不重算、不回放历史"
      - "未完成的触发 / 恢复计数被重置，不带着旧计数跨版本累加"
      - "告警实例与事件记录的 rule_version 与保存后的新版本一致；历史事件仍指向其当时的版本"
      - "启停不产生新版本快照，但记录操作人与时间；停用期间存量未恢复实例原地保留、不评估、不谎报 RECOVERED，重启用后延续同一实例"
      - "内置三规则改阈值 / severity（warning|critical）成功；删除、停用、降为 info 被 4xx + 封闭错误码拒绝（语义归属 INV-4，此处只引用一次）"
    pages: ["实例工作台/监控与报警/告警规则"]
    operations: [updateAlertRule, toggleAlertRule, listAlertRuleVersions, deleteAlertRule]
    crosscut: [INV-4]
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "S1 拍板验收判据原文「ADR-03 全语义可走通」，按 21 号 D1 设为加深基线，不许 pending"
  - id: AC-02-F1
    slice: "02"
    kind: F1
    baseline: true
    title: "权限拒绝：三档角色 × 规则写端点（写权限 = 告警管理员）"
    layer: api
    asserts:
      - "三档角色账号一律经用户管理 API 创建（20 号 D9），不直插 user 表"
      - "只读运维调 createAlertRule / updateAlertRule / toggleAlertRule / deleteAlertRule 得规定拒绝语义，非 500、非静默成功"
      - "告警管理员与平台管理员（按包含关系）调用成功"
      - "三档角色读端点全部可达：可见性不收窄"
    pages: []
    operations: [createAlertRule, updateAlertRule, toggleAlertRule, deleteAlertRule, listAlertRules]
    crosscut: [INV-3]
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "条目内容由 #119 定稿"
  - id: AC-02-F2
    slice: "02"
    kind: F2
    baseline: true
    title: "空状态：规则所需能力不满足 / 指标无样本，落封闭 13 码且不渲染成 0"
    layer: api
    asserts:
      - "规则列表的「所需能力是否满足」在能力缺失时为假，并带原因，不呈现为满足"
      - "指标无样本时告警详情原样透传片①产出的封闭 13 码之一，不造第二来源"
      - "无样本区间不出现补 0 的桶（T2 不补 0 + B6）"
      - "该状态不等同于「条件不满足」：规则不因缺数推进任何状态转换，未完成计数清零"
    pages: ["实例工作台/监控与报警/告警规则"]
    operations: [listAlertRules, getAlertInstance, getMetricSeries]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "条目内容由 #119 定稿"
  - id: AC-02-F3
    slice: "02"
    kind: F3
    baseline: true
    title: "目标库不可达：FIRING 中转 NO_DATA，不恢复、不关闭、仍计一条未恢复告警"
    layer: api
    asserts:
      - "真停目标库容器（真实手段，非 mock）；缺数连续 2 个评估周期后进入 NO_DATA"
      - "实例 ID 与首次触发时间保持，生命周期不中断，仍计一条未恢复告警"
      - "绝不转 RECOVERED —— 数据库不可达擦不掉已知问题"
      - "NO_DATA_ENTERED / NO_DATA_EXITED 事件齐全；NO_DATA 本身不产生通知"
      - "目标库恢复后回到 state_before_no_data，计数从零重新累计，不回放缺数期间"
      - "no_data_policy = ignore 的规则在同一缺数下不进 NO_DATA，与 mark_no_data 严格可区分"
    pages: []
    operations: [listAlertInstances, listAlertEvents]
    crosscut: [INV-1]
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "条目内容由 #119 定稿；片②的 F3 由 NO_DATA 路径承载，能力不足面归片① AC-01-F3/F5/F6"
  - id: AC-02-F4
    slice: "02"
    kind: F4
    baseline: true
    title: "平台自身故障：断平台库期间不得把目标实例判成 NO_DATA、不得产生告警实例"
    layer: api
    asserts:
      - "真断平台库连接（真实手段）；目标库全程健康、真实采集管线仍在产出"
      - "平台库恢复后：不存在因平台故障新建的告警实例，既有实例未被推进到 NO_DATA"
      - "平台故障期间的缺口不计入 NO_DATA 门槛计数（T14：平台自身故障不进入目标告警或 NO_DATA）"
      - "恢复后不回放、不补评估平台故障期间的时间轴"
      - "该故障以平台四态呈现（归片⑨ AC-09-F4），不落到任何目标实例的告警面"
    pages: []
    operations: [listAlertInstances, getPlatformHealth]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "条目内容由 #119 定稿；与 AC-01-F4 / AC-09-F4 手段同源、断言点不同，分工见 docs/design/22-v1-acceptance-entries-b.md D4"
  # ── 片03 · 告警处置与性能事件
  - id: AC-03-S1
    slice: "03"
    kind: S1
    baseline: true
    title: "端到端成功路径：确认 ⇄ 忽略可相互切换且每次操作追加留痕"
    layer: api
    asserts:
      - "对一条 FIRING 告警确认（备注可选）→ 忽略（五档原因码必选）→ 再确认，三次操作全部成功"
      - "忽略选 OTHER 时补充说明必填，缺失即 400 VALIDATION_FAILED + field_errors"
      - "AlertEvent 追加三条处置事件，记录操作人、时间、操作前后处置状态，旧记录不被覆盖"
      - "处置事件保存规则版本、指标值、阈值、评估时间等快照字段，规则改版后处置历史仍自解释"
      - "处置不触发恢复、不停止评估、不停用规则：处置后该实例仍按恢复条件正常 RECOVERED"
      - "恢复后再次触发是新实例，disposition 回到 NONE，不继承旧的已确认"
    pages: []
    operations: [ackAlert, ignoreAlert, listAlertEvents, getAlertInstance]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "条目内容由 #119 定稿"
  - id: AC-03-S2
    slice: "03"
    kind: S2
    baseline: true
    title: "触发现场快照：首次 FIRING 采一次不重采，截断契约成立，永不含 SQL 文本"
    layer: api
    asserts:
      - "在目标库真造阻塞现场（真事务 + 真锁等待，含三层递归阻塞链），触发锁等待类规则"
      - "快照只在首次进入 FIRING 时采一次；后续评估、数值更新、处置变化均不重采（比对 captured_at 恒定）"
      - "会话上限参数化至 5：超限时优先保留直接命中对象与完整阻塞链，记录原始匹配数与截断标识"
      - "快照字段沿 03 §4.5，含 PID / 等待事件 / 时长；全字段扫描断言不含任何 SQL 文本"
      - "一个告警实例至多一份快照；FIRED 事件与事件详情引用同一份，不复制数据"
    pages: []
    operations: [getAlertSnapshot, getAlertInstance]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "S1 拍板验收判据原文「快照首次 FIRING 采一次、截断契约成立」，按 21 号 D1 设为加深基线，不许 pending"
  - id: AC-03-S3
    slice: "03"
    kind: S3
    baseline: true
    title: "性能事件页签四模块与 IA §6.4 告警处理全路径，事件处置写回同一条告警"
    layer: browser
    asserts:
      - "IA §6.4 整条路径：告警详情 → 触发条件 / 触发值 / 阈值 / 持续时长 / 规则版本可见 → 是否 NO_DATA 或维护窗口可见 → 跳性能事件 → 确认或忽略 → 恢复记录可追"
      - "性能事件页签四模块（触发中 / 已恢复 / 已确认已忽略 / 事件详情）按告警实例投影筛选，不存第二份状态"
      - "事件详情展示按事件类型的只读知识模板（原因摘要 + 建议动作），以告警上下文填充"
      - "事件详情引用的快照标注「告警触发时现场」，不得呈现为当前状态"
      - "在事件页做确认 / 忽略后，回到告警详情看到同一处置状态（两处永不分叉）"
      - "跳转带上下文：事件详情 → 标准监控（instance_id / metric_id / 时间范围）、事件详情 → 告警详情（alert_instance_id）"
    pages: ["实例工作台/性能事件", "实例工作台/监控与报警/告警详情"]
    operations: [listPerformanceEvents, getPerformanceEvent, ackAlert, ignoreAlert]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 119
    reason: "S1 拍板判据「事件列表与详情可用」，加深基线；IA §6.4 整条关键路径由本条一条承载（22 号 D3），#120 的告警详情页骨架条目不重复走 §6.4"
  - id: AC-03-F1
    slice: "03"
    kind: F1
