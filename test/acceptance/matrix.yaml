  # ── 片07 · 采集管理页
  - id: AC-07-S1
    slice: "07"
    kind: S1
    baseline: true
    title: "暂停端到端：开关 → 调度器停调度 → 水位不推进 → COLLECTION_PAUSED → 恢复后从最新意图续采"
    layer: api
    asserts:
      - "pauseInstanceCollection 后该实例全部任务不再被调度"
      - "完整性水位不推进（不因暂停而虚假前进，也不判为采集失败）"
      - "指标序列与最新值查询一律 200 + COLLECTION_PAUSED"
      - "操作人与时间系统自动必录，可经暂停状态读取契约读回；原因选填"
      - "resumeInstanceCollection 后从最新意图开始采集，不补跑暂停期"
      - "Agent 全程不知情：照常 push，agent.status 保持 online，但样本一并不写"
    pages: ["实例工作台/采集管理/采集配置"]
    operations: [pauseInstanceCollection, resumeInstanceCollection, getMetricSeries, listInstanceCollectionTasks]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿"
  - id: AC-07-S2
    slice: "07"
    kind: S2
    baseline: true
    title: "配置缺失待办三态四情形：不报假绿、永不隐藏、正向空状态带最近检查时间"
    layer: browser
    asserts:
