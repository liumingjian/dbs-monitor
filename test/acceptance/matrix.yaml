# v1 验收矩阵 · 骨架
#
# 规则与字段定义：docs/design/20-v1-acceptance-matrix.md（决策票 #111）
# 本文件由 #111 生成骨架，逐条内容由 #118 / #119 / #120 / #121 填入。
#
# 硬底：九片 × 5 条基线（S1 + F1..F4）= 45 条，加 7 条横切，加逐条票定稿的加深基线。
# A 组（#118，片01/07/09）定稿 8 条加深基线，硬底因此为 60 —— 出处与理由见
# docs/design/21-v1-acceptance-entries-a.md D1/D2/D4/D6。B/C/D 组（#119/#120/#121）
# 若再定加深基线，同样只增不减，各自在自己的决策记录里交代。
# baseline: true 的条目不许 pending；n-a 必须写 reason。
# 说明：实现落地前 baseline 条目以 pending 占位；v1 判定时 baseline 仍为 pending 即未达标。
# test_ref 规范（#118 定）：值必须内含条目 ID 字面量 —— Go 用 TestAcceptance_AC_01_S1 形，
# Playwright 用 [AC-07-F2] 前缀形，使 B12 漂移门退化为单条 grep。
# 片⑩（发布收口）不出条目，其内容归 #110 / #114。

version: 1
spec: docs/spec/mvp-master-spec.md
rules: docs/design/20-v1-acceptance-matrix.md

# D4 白名单：绕过业务 API 的数据准备，逐条登记理由。默认为空。
exceptions: []

entries:
  # ── 片01 · 采集与指标全量
  - id: AC-01-S1
    slice: "01"
    kind: S1
    baseline: true
    title: "端到端成功路径：经业务 API 建实例 → 真实 Task 采集 → 指标序列出点"
    layer: api
    asserts:
      - "实例经 createInstance 创建，全程无业务表直写（B11）"
      - "≤2×采集周期内 metric_sample 出现该实例的真实样本（由真实 Task 产出）"
      - "getMetricSeries 返回绝对时间桶，无补 0 桶"
      - "collector.last_success_time 完整性水位随全部当期义务满足而推进"
    pages: ["实例工作台/监控与报警/标准监控"]
    operations: [createInstance, getMetricSeries, listInstanceCollectionTasks]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿；实现归片①实现票，届时置 covered 并填 test_ref"
  - id: AC-01-S2
    slice: "01"
    kind: S2
    baseline: true
    title: "全字典对账：每项 P0 指标要么有真实样本，要么显式降级到封闭 13 码，无第三种结局"
    layer: api
    asserts:
      - "遍历 R1 字典全部 P0 指标，逐项二分判定：有真实样本 OR 带封闭 13 码之一的显式降级"
      - "不存在既无样本又无原因码的指标（第三种结局即红）"
      - "降级项的码与该指标所属 Task.Requires 的能力快照事实一致，不得自相矛盾"
      - "指标枚举由字典单一来源生成，与 OpenAPI 枚举一致"
    pages: []
    operations: [getMetricSeries, listInstanceCapabilities]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "S1 拍板验收判据原文（片①Further Notes），按 21 号 D1 设为加深基线，不许 pending 落地后必须 covered"
  - id: AC-01-F1
    slice: "01"
    kind: F1
    baseline: true
    title: "权限拒绝：三档角色 × 任务采样周期写端点"
    layer: api
    asserts:
      - "三档角色账号一律经用户管理 API 创建（D9），不直插 user 表"
      - "只读运维、告警管理员调 updateCollectionTaskInterval 得规定拒绝语义，非 500、非静默成功"
      - "平台管理员调用成功，且 UI 读回的周期恒等于配置值"
    pages: []
    operations: [updateCollectionTaskInterval]
    crosscut: [INV-3]
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿"
  - id: AC-01-F2
    slice: "01"
    kind: F2
    baseline: true
    title: "空状态用户可见路径：IA §6.5 从空图表一路走到采集管理的受影响指标"
    layer: browser
    asserts:
      - "空图表渲染 13 码之一的原因文案，绝不渲染成 0（B6）"
      - "缺桶不补 0，曲线断开而非落到零线"
      - "dataUpdatedAt 数据新鲜度可见（B6）"
      - "时间范围与筛选走 search params 往返（B6）"
      - "从空图表可跳转至采集管理页，并定位到受影响指标行（IA §6.5 全路径）"
    pages: ["实例工作台/监控与报警/标准监控", "实例工作台/采集管理/指标采集状态"]
    operations: [getMetricSeries, listInstanceCapabilities, listInstanceCollectionTasks]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "本组唯一命中 IA §6 关键路径的条目（§6.5），按 21 号 D3 由本条承载整条路径"
  - id: AC-01-F3
    slice: "01"
    kind: F3
    baseline: true
    title: "能力不足降级：真实回收 pg_monitor → MISSING + 修复指引 + 影响 N 项指标"
    layer: api
    asserts:
      - "以真实 SQL 回收监控账号的 pg_monitor 角色（真实手段，非 mock、非直改状态表）"
      - "能力快照 role.pg_monitor = MISSING 且 Class=fixable，附 FixHint"
      - "「影响 N 项指标」沿 Task.Requires 反查得出，无第二张映射表"
      - "受影响指标序列返回 PERMISSION_DENIED，不得表现为「有数据但全零」"
    pages: []
    operations: [listInstanceCapabilities, getMetricSeries]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿"
  - id: AC-01-F4
    slice: "01"
    kind: F4
    baseline: true
    title: "平台自身故障不污染目标侧：平台库不可达期间零告警实例、零 NO_DATA、零样本"
    layer: api
    asserts:
      - "注入平台库不可达（真停平台 PG 容器，与 AC-09-F4 同一手法）"
      - "目标实例侧零新增告警实例、零 NO_DATA"
      - "metric_sample 该实例零新增行（DB 层只读计数，前后对比）"
      - "平台库恢复后采集继续，不补跑、不造占位样本"
    pages: []
    operations: [getMetricSeries]
    crosscut: [INV-4]
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "条目内容由 #118 定稿"
  - id: AC-01-F5
    slice: "01"
    kind: F5
    baseline: true
    title: "目标库不可达：DB_UNREACHABLE + 能力快照整份 UNKNOWN（不是空清单、不是 MISSING）"
    layer: api
    asserts:
      - "真停目标库容器（真实手段）"
      - "指标序列返回 DB_UNREACHABLE"
      - "能力快照整份投影 UNKNOWN，绝不反推为 MISSING，绝不呈现为空清单"
      - "探针 reachable=false 与「平台过载跳过」在任务状态上可区分（跳过不写 reachable=false）"
    pages: []
    operations: [getMetricSeries, listInstanceCapabilities, listInstanceCollectionTasks]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "能力四态的 UNKNOWN 态与不可达故障合并进 F3 会变成两次执行；按 21 号 D2 拆出并设为加深基线"
  - id: AC-01-F6
    slice: "01"
    kind: F6
    baseline: true
    title: "结构性不适用：主库上的复制延迟与无 slot，均为 NOT_APPLICABLE 而非 0"
    layer: api
    asserts:
      - "主库实例上复制延迟类指标返回 NOT_APPLICABLE_ROLE 并附 NAReason，不报错、不空白"
      - "无 replication slot 时呈现「不适用」，与真实积压 0 字节严格可区分"
      - "topo.has_replication / topo.has_slot 能力 Class=structural，不进配置缺失待办"
    pages: []
    operations: [getMetricSeries, listInstanceCapabilities]
    crosscut: []
    status: pending
    test_ref: null
    owner_issue: 118
    reason: "同 AC-01-F5，四态的 NOT_APPLICABLE 态独立成条，加深基线不许 pending"
