    reason: "29 号 D4.1/D4.2。这三面正是「服务端会话表而非无状态 JWT」这条决策的唯一验收面——JWT 做不到即时失效除非再加吊销表。并发不限制一并断死：限制并发会在双人值班或一人两处盯屏时把人锁在门外，而这是监控平台"
