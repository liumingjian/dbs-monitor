name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dbs_monitor
          POSTGRES_USER: dbs_monitor
          POSTGRES_PASSWORD: dbs_monitor
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dbs_monitor -d dbs_monitor"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      postgres12:
        image: postgres:12
        env:
          POSTGRES_DB: monitored
          POSTGRES_USER: monitored
          POSTGRES_PASSWORD: monitored
        ports:
          - 55431:5432
        options: >-
          --health-cmd "pg_isready -U monitored -d monitored"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: 55432
      PGUSER: dbs_monitor
      PGDATABASE: dbs_monitor
      PGPASSWORD: dbs_monitor
      PG12HOST: localhost
      PG12PORT: 55431
      PG12USER: monitored
      PG12DATABASE: monitored
      PG12PASSWORD: monitored
      PGHOST_EXTERNAL: "1"
      DATABASE_URL: postgres://dbs_monitor:dbs_monitor@localhost:55432/dbs_monitor?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make dev-up
      - run: make check
