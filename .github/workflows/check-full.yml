name: check-full

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dbs_monitor
          POSTGRES_USER: dbs_monitor
          POSTGRES_PASSWORD: dbs_monitor
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dbs_monitor -d dbs_monitor"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: 55432
      PGUSER: dbs_monitor
      PGDATABASE: dbs_monitor
      PGPASSWORD: dbs_monitor
      PGHOST_EXTERNAL: "1"
      DATABASE_URL: postgres://dbs_monitor:dbs_monitor@localhost:55432/dbs_monitor?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make dev-up
      - run: make check-full
