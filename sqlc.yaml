version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/instance/queries.sql
    database:
      uri: ${DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: instance
        out: internal/instance
        sql_package: pgx/v5
